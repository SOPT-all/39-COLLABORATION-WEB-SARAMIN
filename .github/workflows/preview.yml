name: Preview

on:
  pull_request:
    branches: [dev, main]

# 같은 PR에 연달아 push하면 이전 미리보기 배포는 취소해요.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # PR에 미리보기 주소 댓글 남기기

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Vercel Preview 배포
    # 포크에서 올린 PR은 시크릿을 쓸 수 없어서 건너뛰어요.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      # 미리보기 댓글은 PR마다 하나만 두고, 새 커밋이 오면 주소만 바꿔요.
      - name: Comment preview URL
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### 🔍 미리보기 배포 완료',
              '',
              '| 항목 | 내용 |',
              '| --- | --- |',
              `| 미리보기 | ${process.env.PREVIEW_URL} |`,
              `| 커밋 | \`${sha}\` |`,
              '',
              '새 커밋을 push하면 이 댓글의 주소가 갱신돼요.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((comment) => comment.body?.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
